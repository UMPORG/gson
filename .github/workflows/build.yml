name: Build

on:
  push:
    branches-ignore:
      # Ignore Dependabot branches because it will also open a pull request, which would cause the
      # workflow to redundantly run twice
      - dependabot/**
  pull_request:

permissions:
  contents: read #  to fetch code (actions/checkout)

env:
  # Common Maven arguments
  MAVEN_ARGS: --show-version --batch-mode --no-transfer-progress

jobs:
  build:
    name: "Build on JDK ${{ matrix.java }} (${{ matrix.java-package }})"
    strategy:
      matrix:
        # sentinel-bench/b01a: the three Temurin `jdk` rows Sentinel's lane runs.
        java: [ 17, 21, 25 ]
        java-package: [ jdk ]
    runs-on: p14-gson

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up JDK ${{ matrix.java }}"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          java-package: ${{ matrix.java-package }}
          cache: 'maven'
      # Hosted runners ship Maven; the reference host does not.
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.11
      - name: Build with Maven
        # This also runs javadoc:jar to detect any issues with the Javadoc generated during release
        run: mvn verify javadoc:jar ${{ matrix.extra-mvn-args || '' }}
